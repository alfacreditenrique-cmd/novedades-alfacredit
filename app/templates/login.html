<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | AlfaCredit S.A.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#154360] to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <!-- HEADER CORPORATIVO -->
        <div class="bg-gradient-to-r from-[#154360] to-[#1b4f72] p-8 text-center text-white relative">
            <div class="inline-block bg-white p-3 rounded-2xl shadow-md mb-3">
                <img src="/static/img/logo.png" alt="AlfaCredit Logo" class="h-12 w-auto" onerror="this.outerHTML='<div class=\'text-2xl font-black text-[#154360]\'>ALFACREDIT</div>'">
            </div>
            <h1 class="text-xl font-black tracking-wide uppercase">AlfaCredit S.A.</h1>
            <p class="text-xs font-semibold text-orange-300 mt-1">Plataforma de Novedades & Control de Combustible</p>
        </div>

        <!-- FORMULARIO DE ACCESO -->
        <div class="p-8">
            {% if mensaje_exito %}
            <div class="mb-5 p-3.5 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-800 text-xs font-semibold rounded flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600 flex-shrink-0"></i>
                <span>{{ mensaje_exito }}</span>
            </div>
            {% endif %}

            {% if error %}
            <div class="mb-5 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs font-semibold rounded flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-500 flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Correo Electrónico</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-2.5 text-slate-400"></i>
                        <input type="email" id="email" name="email" value="{{ email_previo or '' }}" required placeholder="ejemplo@alfacredit.com" 
                               class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-[#154360] focus:border-transparent outline-none transition shadow-sm">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase">Contraseña</label>
                        <a href="/recuperar-password" class="text-[11px] font-bold text-[#d35400] hover:text-orange-700 transition">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-2.5 text-slate-400"></i>
                        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña" 
                               class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-[#154360] focus:border-transparent outline-none transition shadow-sm">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-[#154360] hover:bg-[#103046] text-white font-bold text-sm rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2 mt-2">
                    <span>Iniciar Sesión</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-8 text-center border-t border-slate-100 pt-4">
                <p class="text-[11px] text-slate-400">Sistema Seguro de Gestión Interna &bull; AlfaCredit S.A.</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
